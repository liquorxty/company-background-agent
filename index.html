<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>公司背调 Agent</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f4f6fb; color: #172033; }
    main { width: min(980px, calc(100% - 32px)); margin: 32px auto; }
    .card { background: white; border: 1px solid #e1e6f0; border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px #17203312; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .muted { color: #667085; line-height: 1.6; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; }
    label { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }
    input, textarea, button { font: inherit; }
    input, textarea { border: 1px solid #cfd6e4; border-radius: 9px; padding: 11px 12px; box-sizing: border-box; width: 100%; }
    input:focus, textarea:focus { outline: 2px solid #8aa8ff; border-color: #527cf5; }
    .api-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-top: 14px; }
    .remember { display: flex; align-items: center; gap: 6px; font-weight: 400; white-space: nowrap; }
    .remember input { width: auto; }
    button { border: 0; border-radius: 9px; padding: 11px 18px; background: #315eea; color: white; cursor: pointer; font-weight: 700; }
    button:disabled { background: #aab6d7; cursor: wait; }
    .actions { display: flex; gap: 10px; align-items: center; margin-top: 18px; }
    #status { color: #667085; }
    pre { white-space: pre-wrap; word-break: break-word; background: #111827; color: #e5e7eb; border-radius: 12px; padding: 18px; line-height: 1.65; min-height: 180px; margin-top: 20px; }
    .warning { background: #fff8e1; color: #795900; padding: 10px 12px; border-radius: 9px; margin-top: 16px; line-height: 1.5; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } .api-row { grid-template-columns: 1fr; } .remember { white-space: normal; } }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>公司背调 Agent</h1>
      <div class="muted">输入公司名称、国家和地区。Agent 会先输出详细背调，再输出约 200 字的精简总结。不生成邮件。</div>

      <div class="grid">
        <label>公司名称
          <input id="company" placeholder="例如：Apple Inc." autocomplete="organization">
        </label>
        <label>国家
          <input id="country" placeholder="例如：美国">
        </label>
        <label>地区/城市
          <input id="region" placeholder="例如：加利福尼亚州库比蒂诺">
        </label>
      </div>

      <div class="api-row">
        <input id="apiKey" type="password" placeholder="输入你自己的 RightAPI Key" autocomplete="off">
        <label class="remember"><input id="rememberKey" type="checkbox"> 只在本机记住 Key</label>
      </div>

      <div class="warning">每位使用者都必须输入自己的 RightAPI Key。Key 不会写入 HTML 文件；只有勾选“只在本机记住 Key”时，才会保存到当前浏览器的本地存储。</div>

      <div class="actions">
        <button id="runButton">开始背调</button>
        <span id="status">就绪</span>
      </div>

      <pre id="result">背调结果会显示在这里。</pre>
    </section>
  </main>

  <script>
    const API_URL = "https://www.rightapi.ai/codex/v1/chat/completions";
    const MODEL = "gpt-5.6-luna";
    const SAVED_KEY = "company-background-agent-rightapi-key-v2";

    const systemPrompt = `你是一名严谨的公司背景调查研究员。用户会提供公司名称、国家和地区。

请先完成详细背调，再输出约200字的精简总结。不要生成邮件。

详细背调必须尽可能覆盖：
1. 公司基本信息：正式名称、成立时间、注册地/总部、公司背景、所有权或母公司（如能确认）。
2. 公司规模：员工数量、办公地点、业务覆盖范围、营收或融资信息（只写有可靠依据的内容）。
3. 经营状况：主营业务、当前发展情况、行业位置、公开的风险或异常信息。
4. 主推产品或服务：产品名称、用途、目标客户和竞争特点。
5. 官网及公开资料入口。
6. 产品销售渠道：官网、电商平台、经销商、代理商、线下渠道、区域渠道等。
7. 公开联系人：只列出公开可验证的联系人姓名、职务、公司邮箱、公司电话或公开职业主页；找不到就明确写“未找到”，绝不猜测或编造私人联系方式。
8. 参考来源：列出来源名称和URL；如果当前接口无法实时联网或无法验证来源，要明确标注“未实时验证”，不能假装搜索过网页。

输出格式必须为：
【一、详细背调】
按上面的项目分节回答。

【二、约200字背调总结】
只概括公司背景、规模、主要产品和销售渠道，语言精简，减少无关地名、人名和空话，长度约200个中文字符。

写作规则：区分已确认事实、合理推断和未知信息；不确定的内容使用“待核实”；不要为了完整而编造数据。`;

    const keyInput = document.getElementById("apiKey");
    const rememberInput = document.getElementById("rememberKey");
    const savedKey = localStorage.getItem(SAVED_KEY);
    if (savedKey) {
      keyInput.value = savedKey;
      rememberInput.checked = true;
    }

    function getText(data) {
      const content = data?.choices?.[0]?.message?.content;
      if (typeof content === "string") return content;
      if (Array.isArray(content)) return content.map(item => item.text || "").join("");
      return JSON.stringify(data, null, 2);
    }

    async function callRightApi(company, country, region, apiKey) {
      const userPrompt = `请调查以下公司：\n公司名称：${company}\n国家：${country}\n地区/城市：${region || "未提供"}`;
      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: MODEL,
          reasoning_effort: "high",
          messages: [
            { role: "system", content: systemPrompt },
            { role: "user", content: userPrompt }
          ]
        })
      });

      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data?.error?.message || `API 请求失败：HTTP ${response.status}`);
      return getText(data);
    }

    document.getElementById("runButton").addEventListener("click", async () => {
      const company = document.getElementById("company").value.trim();
      const country = document.getElementById("country").value.trim();
      const region = document.getElementById("region").value.trim();
      const apiKey = keyInput.value.trim();
      const button = document.getElementById("runButton");
      const result = document.getElementById("result");
      const status = document.getElementById("status");

      if (!company || !country || !apiKey) {
        status.textContent = "请至少填写公司名称、国家和 API Key";
        return;
      }
      if (rememberInput.checked) localStorage.setItem(SAVED_KEY, apiKey);
      else localStorage.removeItem(SAVED_KEY);

      button.disabled = true;
      status.textContent = "正在请求 RightAPI……";
      result.textContent = "正在生成详细背调，请稍候……";
      try {
        result.textContent = await callRightApi(company, country, region, apiKey);
        status.textContent = "完成";
      } catch (error) {
        result.textContent = `请求失败：${error.message}\n\n如果是浏览器跨域错误，需要把这个 HTML 通过本地服务器打开，或改用 Python 本地后端。`;
        status.textContent = "失败";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
